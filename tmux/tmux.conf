# -- user defined overrides ----------------------------------------------------

# 作用：强制禁用终端的「备用屏幕」功能，让滚轮在 tmux 里能正常滚动历史，而不是乱飞、跳回旧屏幕。
# smcup, Switch to Alternate Screen（切换到备用屏幕）
# rmcup,  Return to Main Screen
# @,  disable
# *, match all term
# set -g terminal-overrides '*:smcup@:rmcup@'

# edit configuration
bind e new-window -n 'tmux config' "sh -c '\${EDITOR:-nvim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"tmux confg reloaded\"'"

# -- general -------------------------------------------------------------------
bind r source ~/.config/tmux/tmux.conf\; display "~/.config/tmux/tmux.conf sourced!" # reload tmux


set -g default-terminal "tmux-256color"
set -g terminal-features "mouse,RGB,256,clipboard,bpaste,title,underline,strikethrough"
# set-option -g extended-keys all  # requires tmux 3.7+
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 1000                   # increase repeat timeout

set -g default-shell /bin/zsh

# -- display -------------------------------------------------------------------
set -g automatic-rename-format "#T" # window title
set -g set-titles on          # set terminal title

set -g renumber-windows on    # renumber windows when a window is closed

# increase history size
set -g history-limit 100000

# start with mouse mode enabled
set -g mouse on
set -g focus-events on

# highlight active pane
setw -g pane-border-style fg=colour240
setw -g pane-active-border-style fg=colour39

# copy mode & choice mode highlight (Nord blue)
setw -g mode-style bg=colour110,fg=colour234
setw -g clock-mode-colour colour110


# prompt color
set-option -ag message-style fg=yellow,blink
set-option -ag message-style bg=black

# -- keybinding ----------

# new window with prompt
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# -- keybinding: rebind prefix key ---------------------------------------------------

# unbind C-m
set -g prefix C-b

# -- keybinding: windows & pane creation ---------------------------------------------------
unbind '"'
unbind %

bind - split-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- keybinding: navigation -------------------------------------------------------------------
# Vi copypaste mode
set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# vim/neovim/fzf
# is_vim="ps -o state= -o comm= -t '#{pane_tty}'  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_neovim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?n?vim$'"
bind -n M-h if-shell "$is_neovim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_neovim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_neovim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_neovim" "send-keys M-l" "select-pane -R"
bind-key -n M-p if-shell "$is_neovim" "send-keys C-w p" "select-pane -l"


# previous pane, same key as vim 
unbind ';'
unbind p
bind p select-pane -l

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one


# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
# -r means it can be repeat without hit prefix 
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

bind-key Up swap-window -t -1\; select-window -t -1
bind-key Down swap-window -t +1\; select-window -t +1 

unbind -T copy-mode-vi MouseDragEnd1Pane

# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# copy to clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'


# -- buffers -------------------------------------------------------------------

bind = list-buffers  # list paste buffers
#bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# -- theme -------------------------------------------------------------------

# -- TPM Plugins -------------------------------------------------------------
# Auto-install TPM if not present
if "test ! -d ~/.config/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# keybinding, cap S to save, cap R to load
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Initialize TPM (keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
