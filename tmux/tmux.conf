# -- user defined overrides ----------------------------------------------------

# edit configuration
bind e new-window -n '~/.config/tmux/tmux.conf.local' "sh -c '\${EDITOR:-nvim} ~/.config/tmux/* && tmux source ~/.config/tmux/tmux.conf && tmux display \"~/.config/tmux/tmux.conf sourced\"'"

# -- general -------------------------------------------------------------------
bind r source ~/.config/tmux/tmux.conf\; display "~/.config/tmux/tmux.conf sourced!" # reload tmux

set -g default-terminal "tmux-256color"
set -g terminal-features "xterm-256color:RGB"
# set-option -g extended-keys all  # requires tmux 3.7+
set -s escape-time 10                     # faster command sequences
set -sg repeat-time 800                   # increase repeat timeout
set -s focus-events on

set -g default-shell /bin/zsh

# -- display -------------------------------------------------------------------
set -g automatic-rename-format "#T"  # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

# increase history size
set -g history-limit 100000

# start with mouse mode enabled
set -g mouse on

# highlight active pane
setw -g pane-border-style fg=colour240
setw -g pane-active-border-style fg=colour39


# prompt color
set-option -ag message-style fg=yellow,blink
set-option -ag message-style bg=black

# new window with prompt
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# -- windows & pane creation ---------------------------------------------------
unbind '"'
unbind %

bind - split-window -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- navigation -------------------------------------------------------------------
# Vi copypaste mode
set-window-option -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# vim/neovim/fzf
is_vim="ps -o state= -o comm= -t '#{pane_tty}'  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
# using alt key
bind -n M-h run "($is_vim || $is_fzf && tmux send-keys C-w h) || tmux select-pane -L"
bind -n M-j run "($is_vim || $is_fzf && tmux send-keys C-w j) || tmux select-pane -D"
bind -n M-k run "($is_vim || $is_fzf && tmux send-keys C-w k) || tmux select-pane -U"
bind -n M-l run "($is_vim || $is_fzf && tmux send-keys C-w l) || tmux select-pane -R"
bind-key -n M-p if-shell "$is_vim" "send-keys C-w p" "select-pane -l"


# previous pane, same key as vim 
unbind ';'
unbind p
bind p select-pane -l

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one


# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
# -r means it can be repeat without hit prefix 
bind -r C-h previous-window # select previous window
bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

bind-key Up swap-window -t -1\; select-window -t -1
bind-key Down swap-window -t +1\; select-window -t +1 

unbind -T copy-mode-vi MouseDragEnd1Pane

# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# copy to clipboard
if -b 'command -v pbcopy > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | pbcopy"'


# -- buffers -------------------------------------------------------------------

# bind b list-buffers  # list paste buffers
# bind p paste-buffer  # paste from the top paste buffer
# bind P choose-buffer # choose which buffer to paste from

# -- theme -------------------------------------------------------------------

# -- TPM Plugins -------------------------------------------------------------
# Auto-install TPM if not present
if "test ! -d ~/.config/tmux/plugins/tpm" "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'


# status bar
set -g status-interval 10     # redraw status line every 10 seconds
set -g status-position top
set -g status-bg colour235
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# status bar style
# https://www.ditig.com/256-colors-cheat-sheet
set -g status-left '#[fg=colour232,bg=colour154] #S #[fg=colour154,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour222,bg=colour238] #W #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour37,bg=colour235] #(whoami)  up for #(uptime  | cut -d " " -f 4) days #[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]'

set -g status-right '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour37,bg=colour235] %r  %D #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]#[fg=colour39,bg=colour238] #H #[fg=colour154,bg=colour238,nobold,nounderscore,noitalics]'

setw -g window-status-format '#[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]#[fg=color248] #I  #W #[fg=colour235,bg=colour235,nobold,nounderscore,noitalics]'

setw -g window-status-current-format '#[fg=colour235,bg=colour238,nobold,nounderscore,noitalics]#[fg=colour222,bg=colour238] #I  #W  #F #[fg=colour238,bg=colour235,nobold,nounderscore,noitalics]'
