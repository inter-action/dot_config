# using Man/man ranger

# ---------------- ui ----------------
set column_ratios 1,3,4             # 3 colum ratio
set show_hidden true                # show hidden
set colorscheme default             # default, jungle, snow, solarized
set draw_borders true
set line_numbers true               # relative/true/false
set one_indexed true                # Start line numbers from 1 instead of 0
set preview_images false
# ---------------- keymap ----------------


unmap ;
map ;q quit # same as my nvim setting
